services:
  - type: web
    name: threedmarketiran-backend
    env: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPOSITORY
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: PUBLIC_SITE_URL
        sync: false
      - key: API_URL
        value: https://threedmarketiran-backend.onrender.com
      - key: CORS_ORIGIN
        value: https://3dmarketiran.github.io,https://3dmarketiran.ir,https://www.3dmarketiran.ir
      # Cloudflare R2 via the S3-compatible API.
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PUBLIC_ASSET_BASE_URL
        sync: false
      - key: PUBLISH_ASSETS_TO_GITHUB
        value: "true"
      - key: PUBLIC_PUBLISH_TIMEOUT_MS
        value: "300000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"
      - key: TRAFFIC_COST_PER_GB_TOMAN
        value: "23400"
      - key: TRAFFIC_FIXED_COST_TOMAN
        value: "83200"
      - key: TRAFFIC_MIN_PRICE_MARGIN_PCT
        value: "20"
      - key: TRAFFIC_BUNDLE_MIN_MARGIN_PCT
        value: "25"
